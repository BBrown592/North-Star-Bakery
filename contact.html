<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - North Star Bakery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
<nav>
   <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="about.html"> About</a></li>
    <li><a href="contact.html">Contact</a></li>
   </ul>
</nav>

<main>

    <section>
        <h2>Location and Hours</h2>
        <p>Address: 123 Bakers Dr.</p>
        <p>Hours: Sunday-Friday, 6:00 AM-5:00 PM</p>
    </section>

    <section>
        <h2>Inquriy and Pre-Order Request</h2>

        <form>
            <fieldset>
                <legend>Customer Information</legend>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </fieldset>
            
            <fieldset>
                <legend>Request Details</legend>
                <label for="pickup-date">Pickup Date:</label>
                <input type="date" id="pickup-date" name="pickup=date" required>

                <label for="request-type">Request Type</label>
                <select id="request-type" name="request-type" required>
                    <option value="">Select a request type</option>
                    <option value="inquriy">Inquriy</option>
                    <option value="preorder">Pre-Order</option>
                </select>

                    <label for="item-details">Item Details</label>
                    <textarea id="item-details" name="'item-details" rows="4" required></textarea>
                    <label for="allergy-notes">Allergy Notes:</label>
                    <textarea id="allergy-notes" name="allergy-notes" rows="4"></textarea>
            
            </fieldset>
            <button type="submit">Submit Request</button>

        </form>
        </form>
    </section>
</main>

<footer>

</footer>

</body>
</html>
